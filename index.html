<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Punch</title><style>
*{box-sizing:border-box}body{background:#0a1020;color:#edfdfa;font:15px system-ui;margin:0}main{max-width:480px;margin:auto;padding:24px}h1{font-size:30px;margin:9px 0}p{color:#aebbc9}.panel{background:#182638;border:1px solid #32445a;border-radius:20px;padding:18px;margin:18px 0}button{background:#283f52;color:white;border:0;border-radius:12px;padding:13px;font-weight:700}button:active{opacity:.7}.primary,.active{background:#78ead5;color:#102431}#buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}#scope{width:100%;height:70px}label{display:block;margin-top:18px}input[type=range]{width:100%;accent-color:#79f4db}.row{display:flex;justify-content:space-between}small{color:#aab9c9}#state{color:#7bf1d9;margin-top:12px}
</style><main><small>CRYSTAL PUNCH • V0.1</small><h1>Feel the detail.</h1><p>Live bass & clarity EQ for audio played in this demo.</p><div class="panel"><canvas id="scope" width="420" height="70"></canvas><div class="row"><button id="play" class="primary">▶ Play demo</button><button id="load">＋ My audio</button></div><input type="file" id="file" accept="audio/*" hidden><audio id="audio"></audio><div id="state">Ready</div></div><div class="panel"><div class="row"><b>Sound studio</b><button id="toggle">EQ ON</button></div><div id="buttons"><button class="active" data-p="punch">Crystal Punch</button><button data-p="flat">Flat</button><button data-p="warm">Warm</button><button data-p="vocal">Vocal</button></div><label class="row">Bass <output id="bv">+4 dB</output></label><input id="bass" type="range" min="-9" max="9" value="4"><label class="row">Clarity <output id="cv">+3 dB</output></label><input id="clarity" type="range" min="-9" max="9" value="3"></div><small>Processes only audio in this page, not Spotify, TikTok or your earbuds' firmware. Start at low volume.</small></main><script>
(()=>{const $=x=>document.getElementById(x),P={punch:[4,3],flat:[0,0],warm:[5,-1],vocal:[-2,5]};let ctx,mix,filters=[],an,run=false,timer,step=0,next=0,eq=true,imported=false,media;function init(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();mix=ctx.createGain();mix.gain.value=.32;let node=mix;[[90,'lowshelf'],[2700,'peaking']].forEach(([f,type],i)=>{let e=ctx.createBiquadFilter();e.frequency.value=f;e.type=type;e.Q.value=.8;node.connect(e);node=e;filters.push(e)});an=ctx.createAnalyser();an.fftSize=128;node.connect(an);an.connect(ctx.destination);media=ctx.createMediaElementSource($('audio'));media.connect(mix);update()}function update(){['bass','clarity'].forEach((id,i)=>{let v=+$(id).value;$(i?'cv':'bv').textContent=(v>0?'+':'')+v+' dB';if(ctx)filters[i].gain.setTargetAtTime(eq?v:0,ctx.currentTime,.03)})}function tone(f,t,d,v,kind){let o=ctx.createOscillator(),g=ctx.createGain();o.type=kind;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mix);o.start(t);o.stop(t+d+.01)}function beat(){let seq=[110,147,165,131,110,196,165,147];while(next<ctx.currentTime+.18){let n=step%8,t=next;tone(seq[n],t,.23,.12,'sawtooth');tone(n%4===0?55:82,t,.18,.5,'sine');if(n%4===2)tone(220,t,.06,.09,'square');next+=.28;step++}}function stop(){run=false;clearInterval(timer);$('audio').pause();$('play').textContent='▶ Play';$('state').textContent='Paused'}$('play').onclick=async()=>{try{init();await ctx.resume();if(run){stop();return}if(imported){await $('audio').play()}else{next=ctx.currentTime+.06;beat();timer=setInterval(beat,110)}run=true;$('play').textContent='Ⅱ Pause';$('state').textContent='Playing through EQ'}catch(e){$('state').textContent='Audio blocked: '+e.message}};$('load').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;stop();$('audio').src=URL.createObjectURL(f);imported=true;$('state').textContent='Loaded '+f.name};$('audio').onended=stop;['bass','clarity'].forEach(id=>$(id).oninput=update);$('toggle').onclick=()=>{eq=!eq;$('toggle').textContent=eq?'EQ ON':'EQ OFF';update()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const v=P[b.dataset.p];$('bass').value=v[0];$('clarity').value=v[1];update();document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x===b))});const c=$('scope'),g=c.getContext('2d');function draw(){g.clearRect(0,0,420,70);let a=new Uint8Array(64);if(an)an.getByteFrequencyData(a);for(let i=0;i<35;i++){g.fillStyle=i%2?'#8feada':'#a0b4fd';g.fillRect(i*12,70-Math.max(3,(a[i]/255)*65),8,Math.max(3,(a[i]/255)*65))}requestAnimationFrame(draw)}draw();update()})();
</script></html>
